{% extends 'teachers/base.html' %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 60px auto 0;">
  <div class="tp-card">
    <h1 style="color:#fff;font-size:22px;font-weight:800;margin:0 0 4px 0;">Teacher Login</h1>
    <p style="color:#9ca3af;font-size:13px;margin:0 0 20px 0;">Sign in to manage your students.</p>

    {% if error %}<div class="tp-msg error">{{ error }}</div>{% endif %}

    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div style="margin-bottom: 14px;">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email"
               class="tp-input" style="width:100%" placeholder="teacher@school.edu">
      </div>
      <div style="margin-bottom: 20px;">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="tp-input" style="width:100%" placeholder="••••••••">
      </div>
      <button type="submit" class="tp-btn" style="width:100%;padding:10px 14px;font-size:14px;">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
